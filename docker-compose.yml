version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"

  product-service:
    build: ./product-service
    ports:
      - "5002:5002"

  payment-service:
    build: ./payment-service
    ports:
      - "5003:5003"

  frontend:
    build: ./frontend
    ports:
      - "80:5000"  # Map EC2 Port 80 to Container Port 5000
    depends_on:
      - auth-service
      - product-service
      - payment-service
